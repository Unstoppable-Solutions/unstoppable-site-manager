name: Deploy to WordPress.org

# Runs when a GitHub Release is published (tag vX.Y.Z), or by hand from
# Actions → Deploy to WordPress.org → Run workflow (enter an existing tag).
# Needs repository secrets SVN_USERNAME (WordPress.org username) and
# SVN_PASSWORD (the SVN password from WordPress.org → Account & Security).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to deploy (e.g. v1.2.3)'
        required: true

permissions:
  contents: write

concurrency:
  group: wporg-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Push to WordPress.org SVN
    # Pinned: ubuntu-latest moved to Ubuntu 26 (Oct 2026) and the deploy broke there.
    runs-on: ubuntu-24.04
    env:
      SLUG: unstoppable-site-manager
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Work out the version
        id: ver
        run: |
          V="${TAG#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          H=$(grep -m1 -i '^[ *]*Version:' "$SLUG.php" | sed 's/.*Version:[[:space:]]*//' | tr -d '\r ')
          S=$(grep -m1 -i '^Stable tag:' readme.txt | sed 's/.*:[[:space:]]*//' | tr -d '\r ')
          echo "Tag $V | plugin header $H | readme stable tag $S"
          if [ "$V" != "$H" ] || [ "$V" != "$S" ]; then
            echo "::error::The tag ($V), the plugin's Version header ($H) and the readme's Stable tag ($S) must all match."
            exit 1
          fi

      - name: Make sure SVN, rsync and zip are installed
        run: |
          need=""
          command -v svn   >/dev/null || need="$need subversion"
          command -v rsync >/dev/null || need="$need rsync"
          command -v zip   >/dev/null || need="$need zip"
          if [ -n "$need" ]; then
            echo "Installing:$need"
            sudo apt-get update -qq && sudo apt-get install -y -qq $need
          fi
          echo "svn $(svn --version --quiet) | $(rsync --version | head -1) | $(zip -v | sed -n 2p)"


      - name: Check the WordPress.org login
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          if [ -z "$SVN_USERNAME" ] || [ -z "$SVN_PASSWORD" ]; then
            echo "::error::SVN_USERNAME or SVN_PASSWORD is empty. Add them under this repository's Settings → Secrets and variables → Actions → Repository secrets."
            exit 1
          fi
          echo "Username: $SVN_USERNAME (${#SVN_PASSWORD}-character password)"
          svn info "https://plugins.svn.wordpress.org/$SLUG/trunk/" --non-interactive >/dev/null \
            || { echo "::error::Could not reach plugins.svn.wordpress.org. It may be down; re-run in a few minutes."; exit 1; }
          if svn ls "https://plugins.svn.wordpress.org/$SLUG/tags/${{ steps.ver.outputs.version }}/" --non-interactive >/dev/null 2>&1; then
            echo "::error::Version ${{ steps.ver.outputs.version }} is already on WordPress.org. Bump the version and make a new release."
            exit 1
          fi

      - name: Deploy to WordPress.org SVN
        id: deploy
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -o pipefail
          URL="https://plugins.svn.wordpress.org/$SLUG"
          SVN_DIR="$RUNNER_TEMP/svn"
          LOG="$RUNNER_TEMP/svn.log"
          fail() {
            echo "::error title=$1::$(tail -n 8 "$LOG" | tr '\n' ' ' | sed 's/%/%25/g')"
            exit 1
          }
          AUTH=(--non-interactive --no-auth-cache --username "$SVN_USERNAME" --password "$SVN_PASSWORD")

          echo "Checking out $URL"
          svn checkout --depth immediates "$URL" "$SVN_DIR" "${AUTH[@]}" >"$LOG" 2>&1 || fail "SVN checkout failed"
          svn update --set-depth infinity "$SVN_DIR/trunk" "${AUTH[@]}" >>"$LOG" 2>&1 || fail "SVN update of trunk failed"
          svn update --set-depth infinity "$SVN_DIR/assets" "${AUTH[@]}" >>"$LOG" 2>&1 || true

          echo "Copying files into trunk (skipping everything in .distignore)"
          rsync -rc --exclude-from=.distignore --exclude=.git --exclude=.github ./ "$SVN_DIR/trunk/" --delete --delete-excluded
          if [ -d .wordpress-org ]; then rsync -rc .wordpress-org/ "$SVN_DIR/assets/" --delete; fi

          cd "$SVN_DIR"
          svn add . --force --quiet >>"$LOG" 2>&1 || true
          svn status | awk '/^!/ {print $2}' | xargs -r -I% svn rm --quiet %@ >>"$LOG" 2>&1 || true
          svn cp trunk "tags/$VERSION" >>"$LOG" 2>&1 || fail "Could not create tags/$VERSION"
          echo "Changes:"; svn status | head -50

          echo "Committing $VERSION as $SVN_USERNAME"
          if ! svn commit -m "Release $VERSION" "${AUTH[@]}" >>"$LOG" 2>&1; then
            if grep -qiE "E170001|E215004|authoriz|403 Forbidden|401" "$LOG"; then
              fail "WordPress.org refused the login for $SVN_USERNAME (check SVN_USERNAME / SVN_PASSWORD in this repository's secrets)"
            fi
            fail "SVN commit failed"
          fi
          tail -n 3 "$LOG"
          echo "Deployed $VERSION to WordPress.org."

          # Zip for the GitHub Release
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$RUNNER_TEMP/zip/$SLUG"
          rsync -rc "$SVN_DIR/trunk/" "$RUNNER_TEMP/zip/$SLUG/"
          (cd "$RUNNER_TEMP/zip" && zip -qr "$GITHUB_WORKSPACE/$SLUG.zip" "$SLUG")
          echo "zip-path=$GITHUB_WORKSPACE/$SLUG.zip" >> "$GITHUB_OUTPUT"

      - name: Attach the zip to the GitHub Release
        if: github.event_name == 'release'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.deploy.outputs.zip-path }}
